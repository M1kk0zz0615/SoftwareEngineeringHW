<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <rect width="940" height="500" fill="#fbfbfd"/>

  <text x="28" y="38" font-size="19" font-weight="bold" fill="#1f2328">Myapp 性能分析：-n 10000 -r 10（每项取 5 次运行最小值）</text>
  <text x="28" y="62" font-size="13" fill="#59636e">横条长度正比于耗时。绿条 = 本项目采用的做法，红条 = 被否决的朴素做法</text>

  <!-- 生成 10000 道题（端到端） -->
  <text x="28" y="112" font-size="14" fill="#1f2328">生成 10000 道题（端到端）</text>
  <rect x="330" y="100" width="70" height="18" rx="3" fill="#2da44e"/>
  <text x="408" y="114" font-size="13" font-weight="bold" fill="#1f2328">68.9 ms</text>

  <!-- 构造题面/答案/规范串 -->
  <text x="44" y="152" font-size="14" fill="#1f2328">├ 构造题面 / 答案 / 规范串</text>
  <rect x="330" y="140" width="15" height="18" rx="3" fill="#4ac26b"/>
  <text x="353" y="154" font-size="13" fill="#1f2328">15.1 ms（22%）</text>

  <text x="60" y="192" font-size="13" fill="#59636e">│　├ ToInfix 题面渲染</text>
  <rect x="330" y="180" width="9" height="18" rx="2" fill="#7ee2a8"/>
  <text x="347" y="194" font-size="13" fill="#59636e">8.8 ms　← 单次 0.88 μs，是耗时最多的单个函数</text>

  <text x="60" y="232" font-size="13" fill="#59636e">│　└ ToCanonical 查重键</text>
  <rect x="330" y="220" width="6" height="18" rx="2" fill="#7ee2a8"/>
  <text x="344" y="234" font-size="13" fill="#59636e">6.0 ms　← 单次 0.60 μs</text>

  <!-- 查重 HashSet -->
  <text x="44" y="272" font-size="14" fill="#1f2328">├ 查重：HashSet（采用）</text>
  <rect x="330" y="260" width="2" height="18" rx="1" fill="#4ac26b"/>
  <text x="340" y="274" font-size="13" fill="#1f2328">1.6 ms（2%）　← 单次 0.16 μs</text>

  <!-- 查重 List -->
  <text x="44" y="312" font-size="14" fill="#1f2328">└ 查重：List 线性查找（否决）</text>
  <rect x="330" y="300" width="590" height="18" rx="3" fill="#cf222e"/>
  <text x="790" y="314" font-size="13" font-weight="bold" fill="#cf222e">589.9 ms　← 慢 380 倍</text>

  <!-- 树构建残差 -->
  <text x="44" y="352" font-size="14" fill="#59636e">（余下约 52.3 ms 为表达式树随机构建与候选筛选，占 76%）</text>

  <!-- 分隔线 -->
  <line x1="28" y1="372" x2="912" y2="372" stroke="#d0d7de" stroke-width="1"/>

  <!-- 写文件 -->
  <text x="28" y="402" font-size="14" fill="#1f2328">写出 Exercises.txt + Answers.txt</text>
  <rect x="330" y="390" width="5" height="18" rx="2" fill="#2da44e"/>
  <text x="343" y="404" font-size="13" fill="#1f2328">4.7 ms</text>

  <!-- 判题端到端 -->
  <text x="28" y="442" font-size="14" fill="#1f2328">判题 10000 道（端到端）</text>
  <rect x="330" y="430" width="31" height="18" rx="3" fill="#2da44e"/>
  <text x="369" y="444" font-size="13" font-weight="bold" fill="#1f2328">30.7 ms</text>

  <text x="44" y="480" font-size="14" fill="#1f2328">└ 其中解析并求值</text>
  <rect x="330" y="468" width="18" height="18" rx="3" fill="#4ac26b"/>
  <text x="356" y="482" font-size="13" fill="#1f2328">18.0 ms（59%）</text>
</svg>
